services:
  - type: web
    name: kaapan-backend
    env: python
    rootDir: swasthyasetu/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: OPENAI_MODEL
        value: gpt-4o-mini
